name: sunlena-prod

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sunlena}
      POSTGRES_USER: ${POSTGRES_USER:-sunlena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the EC2 .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      SUNLENA_ENVIRONMENT: production
      SUNLENA_LOG_LEVEL: INFO
      SUNLENA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sunlena}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-sunlena}
      SUNLENA_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID in the EC2 .env file}
      SUNLENA_FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-admin.json
      SUNLENA_APPLE_SEARCH_COUNTRY: ${APPLE_SEARCH_COUNTRY:-IN}
      SUNLENA_MEDIA_ROOT: /var/lib/sunlena/media
      SUNLENA_MEDIA_MAX_USER_BYTES: 524288000
      SUNLENA_MEDIA_SIGNING_SECRET: ${SUNLENA_MEDIA_SIGNING_SECRET:?Set SUNLENA_MEDIA_SIGNING_SECRET in the EC2 .env file}
    volumes:
      - ./.secrets/firebase-admin.json:/run/secrets/firebase-admin.json:ro
      - media_data:/var/lib/sunlena/media
    depends_on:
      database:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      SUNLENA_ENVIRONMENT: production
      SUNLENA_LOG_LEVEL: INFO
      SUNLENA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sunlena}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-sunlena}
      SUNLENA_MEDIA_ROOT: /var/lib/sunlena/media
      SUNLENA_MEDIA_MAX_FILE_BYTES: 157286400
      SUNLENA_MEDIA_MAX_USER_BYTES: 524288000
      SUNLENA_YTDLP_POT_PROVIDER_URL: http://bgutil-provider:4416
    volumes:
      - media_data:/var/lib/sunlena/media
    depends_on:
      database:
        condition: service_healthy
      api:
        condition: service_healthy
      bgutil-provider:
        condition: service_started
    command: ["python", "-m", "app.modules.media.worker"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0-deno
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./apps/web
      target: production
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?Set VITE_FIREBASE_API_KEY in the EC2 .env file}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?Set VITE_FIREBASE_AUTH_DOMAIN in the EC2 .env file}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?Set VITE_FIREBASE_PROJECT_ID in the EC2 .env file}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?Set VITE_FIREBASE_APP_ID in the EC2 .env file}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SUNLENA_HOST: ${SUNLENA_HOST:?Set SUNLENA_HOST to your domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:

[project]
name = "sunlena-api"
version = "0.1.0"
description = "SunLena modular monolith API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "httpx>=0.28,<1.0",
  "firebase-admin>=6.6,<8.0",
  "yt-dlp>=2026.3.13",
  "pydub>=0.25.1",
  "python-multipart>=0.0.20,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

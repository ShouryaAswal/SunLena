name: sunlena

services:
  api:
    build:
      context: ./apps/api
    environment:
      SUNLENA_ENVIRONMENT: development
      SUNLENA_LOG_LEVEL: INFO
      SUNLENA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sunlena}:${POSTGRES_PASSWORD:-local_only_change_me}@database:5432/${POSTGRES_DB:-sunlena}
      SUNLENA_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      SUNLENA_FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-admin.json
      SUNLENA_APPLE_SEARCH_COUNTRY: ${APPLE_SEARCH_COUNTRY:-IN}
      SUNLENA_MEDIA_ROOT: /var/lib/sunlena/media
      SUNLENA_MEDIA_MAX_USER_BYTES: 524288000
      SUNLENA_MEDIA_SIGNING_SECRET: ${SUNLENA_MEDIA_SIGNING_SECRET:-local-only-change-me}
      SUNLENA_MEDIA_EXTRACTOR: ${SUNLENA_MEDIA_EXTRACTOR:-yt-dlp}
    volumes:
      - ./.secrets:/run/secrets:ro
      - media_data:/var/lib/sunlena/media
      - ./apps/api/app:/app/app:ro
      - ./apps/api/migrations:/app/migrations:ro
      - ./apps/api/alembic.ini:/app/alembic.ini:ro
    depends_on:
      database:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ./apps/api
    environment:
      SUNLENA_ENVIRONMENT: development
      SUNLENA_LOG_LEVEL: INFO
      SUNLENA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sunlena}:${POSTGRES_PASSWORD:-local_only_change_me}@database:5432/${POSTGRES_DB:-sunlena}
      SUNLENA_MEDIA_ROOT: /var/lib/sunlena/media
      SUNLENA_MEDIA_MAX_FILE_BYTES: 157286400
      SUNLENA_MEDIA_MAX_USER_BYTES: 524288000
      SUNLENA_YTDLP_POT_PROVIDER_URL: http://bgutil-provider:4416
      SUNLENA_MEDIA_EXTRACTOR: ${SUNLENA_MEDIA_EXTRACTOR:-yt-dlp}
      SUNLENA_YOUTUBE_EXTRACTOR: ${SUNLENA_YOUTUBE_EXTRACTOR:-yt-dlp}
      SUNLENA_COBALT_API_BASE_URL: ${SUNLENA_COBALT_API_BASE_URL:-http://cobalt:9000/}
      SUNLENA_COBALT_API_TOKEN: ${SUNLENA_COBALT_API_TOKEN:-}
      SUNLENA_COBALT_AUTH_SCHEME: ${SUNLENA_COBALT_AUTH_SCHEME:-Api-Key}
      SUNLENA_COBALT_REQUEST_TIMEOUT_SECONDS: ${SUNLENA_COBALT_REQUEST_TIMEOUT_SECONDS:-30}
      SUNLENA_COBALT_DOWNLOAD_TIMEOUT_SECONDS: ${SUNLENA_COBALT_DOWNLOAD_TIMEOUT_SECONDS:-180}
    volumes:
      - media_data:/var/lib/sunlena/media
    depends_on:
      database:
        condition: service_healthy
      api:
        condition: service_healthy
      bgutil-provider:
        condition: service_started
    command: ["python", "-m", "app.modules.media.worker"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0-deno
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./apps/web
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sunlena}
      POSTGRES_USER: ${POSTGRES_USER:-sunlena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No host port: connect from containers on the Compose network.

volumes:
  postgres_data:
  media_data:
